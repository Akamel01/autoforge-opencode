# AutoForge model policy — central authority for child-agent model allocation
# Override hierarchy: global default → role-specific → task/module-specific → explicit runtime override
# Runtime overrides must not permanently modify this file unless explicitly requested.
# Registry: ./model-registry.yaml — orchestrator MUST lookup window/capabilities before sizing Tasks.

registry: ./model-registry.yaml

defaults:
  provider: opencode
  model: gpt-5-nano

child_agents:
  discovery:
    provider: opencode
    model: gpt-5-nano
  requirements-griller:
    provider: opencode
    model: gpt-5-nano
  # architect/planner/reviewer inherit orchestrator's model (no pin) — see agents/*.md with no model field.
  # When main is muse-spark-1.2 (1M) / gpt-5 (400k) / gpt-5-nano (400k) / qwen/grok, those three get the same
  # window; workers + others stay pinned to gpt-5-nano for throughput.
  architect:
    provider: opencode
    model: inherit
  planner:
    provider: opencode
    model: inherit
  reviewer:
    provider: opencode
    model: inherit
  worker:
    provider: opencode
    model: gpt-5-nano
  validator:
    provider: opencode
    model: gpt-5-nano
  investigator:
    provider: opencode
    model: gpt-5-nano

# Model-aware guidance: orchestrator budgets prompt ≈ min(context_window * 0.30, 80000) tok
# per model-registry.yaml guidance; architect/planner/reviewer inherit main window, workers stay on
# gpt-5-nano. Override per task via Task(model="...") without editing this file — omit model to inherit.
