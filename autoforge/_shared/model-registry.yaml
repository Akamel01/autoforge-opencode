# AutoForge model registry — capability + window metadata for model-aware delegation
# Orchestrator MUST lookup resolved model here before sizing Task prompts.
# Update via `node scripts/sync-models.mjs --check` (warns on missing `opencode models` entries).
# Windows are upstream documented values (approx tok); guidance encodes sizing heuristic.
# Do not store secrets here.

defaults:
  unknown_model:
    context_window: 64000
    max_output: 8192
    capabilities: [tools]
    cost: unknown
    strengths: []
    guidance: "Conservative: summarize inputs, cap prompt at 30k tok, require concise Return."

models:
  opencode/gpt-5-nano:
    context_window: 128000
    max_output: 16384
    capabilities: [tools, structured-output, fast]
    cost: low
    strengths: [high-throughput, small-module execution, worker]
    guidance: "Budget 38k tok (30%). Summarize >5 files, tracker-index verbatim only."

  opencode/gpt-5:
    context_window: 272000
    max_output: 32768
    capabilities: [tools, reasoning, vision, structured-output]
    cost: high
    strengths: [planning, critique, architecture, orchestrator]
    guidance: "Budget 80k tok. Can ingest tracker-index + 2 reports verbatim; include rationale."

  opencode/gpt-5.1:
    context_window: 272000
    max_output: 32768
    capabilities: [tools, reasoning, vision]
